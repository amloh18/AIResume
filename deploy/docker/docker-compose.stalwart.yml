version: '3.8'

# BuildAIResume - Stalwart Mail Server Configuration
# Self-hosted SMTP for application emails
# Internal Docker network communication only

networks:
  buildairesume_network:
    external: true

services:
  stalwart:
    image: stalwartlabs/mail-server:v0.10.6
    container_name: buildairesume-stalwart
    restart: unless-stopped
    networks:
      - buildairesume_network
    ports:
      # SMTP ports - only expose what's necessary
      - '25:25'       # SMTP server-to-server (direct delivery)
      - '587:587'     # SMTP submission (authenticated)
      - '465:465'     # SMTPS (secure submission)
      
      # Admin interface - LOCALHOST ONLY (not exposed publicly)
      - '127.0.0.1:8080:8080'
      
      # IMAP - only if mailbox reading is required (future use)
      # - '993:993'
    
    volumes:
      # Persistent Stalwart data
      - /opt/stalwart-data:/opt/stalwart
      
      # Optional: Custom configuration
      # - ./stalwart/config:/opt/stalwart/config
    
    environment:
      # Domain configuration
      - STALWART_DOMAIN=buildairesume.com
      
      # Admin credentials (use secrets in production)
      - STALWART_ADMIN_USER=admin
      - STALWART_ADMIN_SECRET=${STALWART_ADMIN_PASSWORD}
      
      # SMTP configuration
      - STALWART_SMTP_HOST=0.0.0.0
      - STALWART_SMTP_PORT=587
      
      # TLS configuration
      - STALWART_TLS_CERT=/opt/stalwart/certs/cert.pem
      - STALWART_TLS_KEY=/opt/stalwart/certs/key.pem
    
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '587']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Security: drop all capabilities, add only necessary ones
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
