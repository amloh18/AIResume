services:
  - type: web
    name: circle-cv-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://circle-cv-app.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true 