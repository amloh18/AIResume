<rect x="376" y="215" width="125" height="25" rx="12.5" fill="#c2f3d5"/><text x="438.5" y="232" text-anchor="middle" class="tag">INGESTION</text>
<text x="376" y="269" class="cardtitle">resumebuilder-worker</text>
<text x="376" y="296" class="body">Adapters and normalization</text><text x="376" y="317" class="body">Canonical deduplication</text><text x="376" y="338" class="body">Distributed-lock scheduler</text>
<!-- db -->
<g filter="url(#shadow)"><rect x="700" y="195" width="224" height="170" rx="18" fill="#ffffff" stroke="#d4e6da"/></g>
<rect x="720" y="215" width="91" height="25" rx="12.5" fill="#e6f7ed"/><text x="765.5" y="232" text-anchor="middle" class="tag">STORAGE</text>
<ellipse cx="812" cy="276" rx="34" ry="10" fill="#d0efdb" stroke="#72bd8e"/><path d="M778 276v36c0 6 15 11 34 11s34-5 34-11v-36" fill="#eaf8ef" stroke="#72bd8e"/><ellipse cx="812" cy="312" rx="34" ry="10" fill="#d0efdb" stroke="#72bd8e"/>
<text x="812" y="346" text-anchor="middle" class="cardtitle">MongoDB</text>
