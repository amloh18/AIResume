<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">AIResume high-level architecture</title>
<desc id="desc">Job sources flow into the resumebuilder worker, which normalizes and deduplicates jobs before writing to MongoDB. The Next.js AIResume application reads from MongoDB and serves candidates. A separate private admin panel connects to the app's operational layer. The app has web and worker runtime targets.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6faf7"/><stop offset="1" stop-color="#eaf5ee"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbffeb"/><stop offset="1" stop-color="#b8f4d1"/></linearGradient>
 <linearGradient id="darkgreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#083b2a"/><stop offset="1" stop-color="#13583d"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#244c37" flood-opacity=".11"/></filter>
 <style>
 .title{font:700 30px Inter,ui-sans-serif,system-ui,sans-serif;fill:#143a2b}.subtitle{font:400 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#587365}.cardtitle{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#153e2d}.body{font:400 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#527163}.small{font:600 11px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.1px;fill:#337552}.white{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4fff8}.whitebody{font:400 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#c4e2d1}.tag{font:700 11px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0d6945}
 </style>
</defs>
<rect width="1440" height="650" rx="24" fill="url(#bg)"/>
<text x="56" y="57" class="small">SYSTEM OVERVIEW</text>
<text x="56" y="96" class="title">A simple split between ingestion, data, and the app</text>
<text x="56" y="125" class="subtitle">Job discovery is isolated from the web tier; the application reads normalized demand and manages the candidate workflow.</text>
<!-- source list -->
<g filter="url(#shadow)"><rect x="56" y="195" width="240" height="170" rx="18" fill="#ffffff" stroke="#d4e6da"/></g>
<rect x="76" y="215" width="105" height="25" rx="12.5" fill="#e6f7ed"/><text x="128.5" y="232" text-anchor="middle" class="tag">INPUTS</text>
<text x="76" y="269" class="cardtitle">Job sources</text>
<text x="76" y="296" class="body">Adzuna · Remotive</text><text x="76" y="317" class="body">RemoteOK · JobSpy</text><text x="76" y="338" class="body">LinkedIn · ATS platforms</text>
