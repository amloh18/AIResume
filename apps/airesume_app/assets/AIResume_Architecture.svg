<text x="1012" y="236" class="white">AIResume · Next.js</text>
<text x="1012" y="261" class="whitebody">Build · Match · Tailor · Apply · Track · Learn</text>
<rect x="1012" y="287" width="160" height="70" rx="12" fill="#1a6849" stroke="#4b9e72"/><text x="1092" y="312" text-anchor="middle" class="white" style="font-size:15px">Web tier</text><text x="1092" y="333" text-anchor="middle" class="whitebody" style="font-size:11px">Runner target</text>
