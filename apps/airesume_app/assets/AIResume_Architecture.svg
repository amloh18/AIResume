<circle cx="94" cy="483" r="17" fill="#e2f6e9"/><circle cx="94" cy="478" r="5" fill="none" stroke="#218552" stroke-width="2"/><path d="M83 493c2-9 20-9 22 0" fill="none" stroke="#218552" stroke-width="2" stroke-linecap="round"/>
<text x="126" y="482" class="cardtitle">Candidate experience</text><text x="82" y="519" class="body">Resume editor, ATS scoring, tailored documents,</text><text x="82" y="541" class="body">job discovery, application history and analytics.</text>
