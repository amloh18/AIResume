<rect x="556" y="463" width="115" height="25" rx="12.5" fill="#fff1d6"/><text x="613.5" y="480" text-anchor="middle" style="font:700 11px Inter,ui-sans-serif,system-ui,sans-serif;fill:#94610d">PRIVATE</text>
<text x="556" y="517" class="cardtitle">Admin panel</text><text x="556" y="541" class="body">Separate private repository and deployment;</text><text x="556" y="562" class="body">not included in this public source repository.</text>
<g filter="url(#shadow)"><rect x="1004" y="445" width="380" height="142" rx="18" fill="#e2f7eb" stroke="#b7e4c7"/></g>
<text x="1030" y="478" class="small">DEPLOYMENT</text><text x="1030" y="509" class="cardtitle">Self-managed infrastructure</text><text x="1030" y="535" class="body">Docker · Dokploy · Traefik · Cloudflare</text><text x="1030" y="557" class="body">Separate runner and worker runtime targets</text>
