name: Feature request
description: Propose a capability or an improvement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The product journey is **BUILD → MATCH → TAILOR → APPLY → TRACK → LEARN**. It helps to say
        which stage your idea belongs to.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution. What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Which stage of the journey?
      options:
        - BUILD — resume creation and editing
        - MATCH — job discovery and matching
        - TAILOR — per-job tailoring and cover letters
        - APPLY — applying to a job (incl. auto-apply)
        - TRACK — application tracking and email
        - LEARN — analytics
        - Account, auth or billing
        - Self-hosting / deployment
        - Platform / not stage-specific
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including any workaround you are using today.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this request.
          required: true
