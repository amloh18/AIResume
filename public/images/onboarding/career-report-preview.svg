<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#1A261A"/>
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#222B22" stroke="#80FF00" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="40" y="40" width="320" height="40" rx="8" fill="#80FF00"/>
  <text x="200" y="65" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="16" font-weight="bold">AI Career Report</text>
  
  <!-- Experience Level Card -->
  <rect x="60" y="100" width="150" height="80" rx="8" fill="#333333"/>
  <text x="135" y="120" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Experience Level</text>
  <text x="135" y="140" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Senior</text>
  <text x="135" y="160" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="10">5+ years experience</text>
  
  <!-- Career Path Card -->
  <rect x="230" y="100" width="150" height="80" rx="8" fill="#333333"/>
  <text x="305" y="120" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Career Path</text>
  <text x="305" y="140" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Lead Developer</text>
  <text x="305" y="160" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="10">Next 2 years</text>
  
  <!-- Skills Gap -->
  <rect x="60" y="200" width="150" height="60" rx="8" fill="#333333"/>
  <text x="135" y="220" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Skills Gap</text>
  <text x="135" y="240" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="12">Machine Learning</text>
  
  <!-- Recommendations -->
  <rect x="230" y="200" width="150" height="60" rx="8" fill="#333333"/>
  <text x="305" y="220" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Recommendations</text>
  <text x="305" y="240" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="12">Learn React</text>
  
  <!-- AI Sparkles -->
  <circle cx="350" cy="60" r="8" fill="#80FF00"/>
  <circle cx="50" cy="200" r="6" fill="#80FF00"/>
  <circle cx="350" cy="200" r="6" fill="#80FF00"/>
</svg>
