<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#1A261A"/>
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#222B22" stroke="#80FF00" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="40" y="40" width="320" height="40" rx="8" fill="#80FF00"/>
  <text x="200" y="65" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Journey Cards Dashboard</text>
  
  <!-- Cards Grid -->
  <rect x="60" y="100" width="80" height="60" rx="6" fill="#333333"/>
  <rect x="160" y="100" width="80" height="60" rx="6" fill="#333333"/>
  <rect x="260" y="100" width="80" height="60" rx="6" fill="#333333"/>
  
  <!-- Card Content -->
  <circle cx="100" cy="130" r="8" fill="#80FF00"/>
  <text x="100" y="155" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="12">Job 1</text>
  
  <circle cx="200" cy="130" r="8" fill="#80FF00"/>
  <text x="200" y="155" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="12">Job 2</text>
  
  <circle cx="300" cy="130" r="8" fill="#80FF00"/>
  <text x="300" y="155" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="12">Job 3</text>
  
  <!-- Document Links -->
  <line x1="100" y1="160" x2="100" y2="200" stroke="#80FF00" stroke-width="2"/>
  <rect x="80" y="200" width="40" height="20" rx="4" fill="#80FF00"/>
  <text x="100" y="213" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="10">CV</text>
  
  <line x1="200" y1="160" x2="200" y2="200" stroke="#80FF00" stroke-width="2"/>
  <rect x="180" y="200" width="40" height="20" rx="4" fill="#80FF00"/>
  <text x="200" y="213" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="10">CV</text>
  
  <line x1="300" y1="160" x2="300" y2="200" stroke="#80FF00" stroke-width="2"/>
  <rect x="280" y="200" width="40" height="20" rx="4" fill="#80FF00"/>
  <text x="300" y="213" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="10">CV</text>
  
  <!-- Footer -->
  <text x="200" y="250" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Link Documents to Applications</text>
</svg>
