<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#1A261A"/>
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#222B22" stroke="#80FF00" stroke-width="2"/>
  
  <!-- Browser Window -->
  <rect x="40" y="40" width="320" height="200" rx="8" fill="#333333"/>
  
  <!-- Browser Header -->
  <rect x="40" y="40" width="320" height="30" rx="8" fill="#444444"/>
  <circle cx="60" cy="55" r="4" fill="#ff5f57"/>
  <circle cx="80" cy="55" r="4" fill="#ffbd2e"/>
  <circle cx="100" cy="55" r="4" fill="#28ca42"/>
  
  <!-- Extension Icon -->
  <rect x="280" y="45" width="60" height="20" rx="4" fill="#80FF00"/>
  <text x="310" y="57" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="10" font-weight="bold">CVCircle</text>
  
  <!-- Job Board Content -->
  <rect x="60" y="80" width="280" height="140" rx="6" fill="#222B22"/>
  
  <!-- Job Listings -->
  <rect x="80" y="100" width="240" height="25" rx="4" fill="#333333"/>
  <text x="90" y="115" fill="#80FF00" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Senior Software Engineer - Google</text>
  <circle cx="300" cy="112" r="8" fill="#80FF00"/>
  
  <rect x="80" y="135" width="240" height="25" rx="4" fill="#333333"/>
  <text x="90" y="150" fill="#80FF00" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Product Manager - Microsoft</text>
  <circle cx="300" cy="147" r="8" fill="#80FF00"/>
  
  <rect x="80" y="170" width="240" height="25" rx="4" fill="#333333"/>
  <text x="90" y="185" fill="#80FF00" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UX Designer - Apple</text>
  <circle cx="300" cy="182" r="8" fill="#80FF00"/>
  
  <!-- Extension Popup -->
  <rect x="200" y="120" width="120" height="80" rx="8" fill="#1A261A" stroke="#80FF00" stroke-width="2"/>
  <text x="260" y="140" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Track Application</text>
  <rect x="210" y="150" width="100" height="25" rx="4" fill="#80FF00"/>
  <text x="260" y="165" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Auto Track</text>
  
  <!-- Footer -->
  <text x="200" y="270" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">One-Click Application Tracking</text>
</svg>
