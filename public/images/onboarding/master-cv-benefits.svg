<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#1A261A"/>
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#222B22" stroke="#80FF00" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="40" y="40" width="320" height="40" rx="8" fill="#80FF00"/>
  <text x="200" y="65" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Master CV Benefits</text>
  
  <!-- CV Preview -->
  <rect x="60" y="100" width="120" height="160" rx="8" fill="#333333"/>
  
  <!-- CV Header -->
  <rect x="70" y="110" width="100" height="20" rx="4" fill="#80FF00"/>
  <text x="120" y="123" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="10" font-weight="bold">John Doe</text>
  
  <!-- CV Sections -->
  <rect x="70" y="140" width="100" height="15" rx="2" fill="#444444"/>
  <text x="120" y="150" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="8">Experience</text>
  
  <rect x="70" y="160" width="100" height="15" rx="2" fill="#444444"/>
  <text x="120" y="170" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="8">Education</text>
  
  <rect x="70" y="180" width="100" height="15" rx="2" fill="#444444"/>
  <text x="120" y="190" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="8">Skills</text>
  
  <rect x="70" y="200" width="100" height="15" rx="2" fill="#444444"/>
  <text x="120" y="210" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="8">Projects</text>
  
  <!-- Benefits List -->
  <text x="220" y="120" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓ ATS Optimized</text>
  <text x="220" y="140" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓ AI Enhanced</text>
  <text x="220" y="160" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓ Multiple Templates</text>
  <text x="220" y="180" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓ Auto Formatting</text>
  <text x="220" y="200" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓ Export Options</text>
  
  <!-- CTA Button -->
  <rect x="220" y="220" width="120" height="30" rx="6" fill="#80FF00"/>
  <text x="280" y="238" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Create Master CV</text>
  
  <!-- Footer -->
  <text x="200" y="280" text-anchor="middle" fill="#80FF00" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Your Career Foundation</text>
</svg>
